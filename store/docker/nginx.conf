server {
    listen 80;
    server_name _;
    index index.php index.html;
    root /var/www/html/store/public;

    client_max_body_size 20m;

    # فایل‌های آپلودی (مدیا لایبرری) — ^~ تا قبل از location های regex بررسی شود
    location ^~ /storage/ {
        alias /var/www/html/store/storage/app/public/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # فایل‌های استاتیک
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
        include fastcgi_params;
    }

    location ~ /\. { deny all; }
}
